<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Good Wren</title>

    <meta
        name="description"
        content="An interactive map-first Arizona food resource locator."
    />

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
    <link rel="icon" type="image/png" href="/assets/wrenlogo-favicon-icon.png">
</head>

<body>


<header class="header">
    <div class="brand">
        <picture class="brand-picture">
            <source media="(max-width: 900px)" srcset="/assets/wrenlogo-submark-icon.png">
            <img src="/assets/wrenlogo-icon.png" alt="" class="brand-logo">
        </picture>

        <h1>The Good <span>Wren</span></h1>
    </div>

    <form id="location-search">
        <label for="zip-code">Search by ZIP Code:</label>
        <input
            type="text"
            id="zip-code"
            name="zip-code"
            inputmode="numeric"
            maxlength="5"
            placeholder="ex. 85331"
            autocomplete="postal-code"
        >
        <button type="submit" class="search-button">Search</button>
        <button type="button" id="clear-search">Clear</button>
    </form>
</header>

<main class="map-container">

    <div id="map" aria-label="Map of food assistance resources"></div>

    <aside id="resource-card" class="resource-card" hidden 
        aria-label="Selected resource information">
        
        <button id="close-resource-card" type="button"
            aria-label="Close resource information">x</button>
        
        <div id="resource-card-content"></div>
    </aside>

    <aside id="resource-filters" aria-label="Resource filters">
        <h2>Filter by Type</h2>

        <button
            id="filter-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="filter-options"
        >
            <span class="filter-toggle-icon" aria-hidden="true">☷</span>
            <span>Filters</span>
        </button>

        <div class="filter-options" id="filter-options">
            <label><input type="checkbox" value="Food Bank">Food Bank</label>
            <label><input type="checkbox" value="Food Pantry">Food Pantry</label>
            <label><input type="checkbox" value="Community Meal">Community Meal</label>
            <label><input type="checkbox" value="Food Distribution">Food Distribution</label>
        </div>
    </aside>

    <div id="search-message" role="status" aria-live="polite"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="script.js"></script>
</body>
</html>
