<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Finder Prototype</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
</head>

<body>
<h1>Food Finder Prototype</h1>

<form id="location-search">
    <label for="zip-code">Search by ZIP Code:</label>
    <input
        type="text"
        id="zip-code"
        name="zip-code"
        inputmode="numeric"
        maxlength="5"
        placeholder="ex. 85331"
    >
    <button type="submit">Search</button>
</form>

<div id="search-message"></div>

<div id="resource-filters">
    <p>Filter by Resource Type:</p>
    <label>
        <input type="checkbox" value="Food Bank">Food Bank
    </label>

    <label>
        <input type="checkbox" value="Food Pantry">Food Pantry
    </label>

    <label>
        <input type="checkbox" value="Community Meal">Community Meal
    </label>

    <label>
        <input type="checkbox" value="Food Distribution">Food Distribution
    </label>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="script.js"></script>
</body>
</html>
